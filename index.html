<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets us read env(safe-area-inset-*) on
         notched iPhones so fixed UI (WhatsApp float, etc.) can sit above
         the iOS home indicator instead of being clipped by it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c100e" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The fonts of the first screen. The @font-face rules are in index.css. -->
    <link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/host-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/host-grotesk-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />

    <meta name="author" content="Sagar H R & Co." />
    <meta name="geo.region" content="IN-KA" />
    <meta name="geo.placename" content="Mysuru, Karnataka" />

    <meta property="og:site_name" content="Sagar H R & Co." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- SEO-2: static fallback metadata. Social/link scrapers (WhatsApp,
         LinkedIn, X, Facebook) don't run JavaScript, so without these the raw
         HTML had no title/description/preview and every share was blank. When
         JS runs, the per-route <SEO> component (React 19 document metadata)
         supplies the exact per-page title/description/canonical. A full
         prerendering pass will later render correct per-page meta server-side. -->
    <title>Sagar H R &amp; Co. — Chartered Accountants in Mysuru | Audit, Tax, GST &amp; Advisory</title>
    <meta
      name="description"
      content="Sagar H R &amp; Co. is a Chartered Accountancy firm in Mysuru, Karnataka offering Audit &amp; Assurance, Direct Tax, GST and Business Advisory services for individuals and businesses."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sagar H R &amp; Co. — Chartered Accountants in Mysuru" />
    <meta
      property="og:description"
      content="Audit &amp; Assurance, Direct Tax, GST and Business Advisory from a Mysuru-based CA firm."
    />
    <meta property="og:image" content="https://casagar.co.in/og/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sagar H R &amp; Co. — Chartered Accountants in Mysuru" />
    <meta
      name="twitter:description"
      content="Audit &amp; Assurance, Direct Tax, GST and Business Advisory from a Mysuru-based CA firm."
    />
    <meta name="twitter:image" content="https://casagar.co.in/og/og-default.png" />
    <style>
      /* First paint of the home page, before the app has loaded: the limestone
         the page opens on (--stone in components/redesign/redesign.css;
         scripts/check-csp-hash.ts checks the colour matches). index.tsx
         removes it once the page has painted. */
      #preload-hero {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: #f2efe8;
      }
    </style>
  </head>

  <body class="overflow-x-hidden bg-[#F2F2F0] text-[#111111]">
    <div id="preload-hero" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
