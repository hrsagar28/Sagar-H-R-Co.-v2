<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets us read env(safe-area-inset-*) on
         notched iPhones so fixed UI (the toasts, the offline bar) can sit
         above the iOS home indicator instead of being clipped by it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c100e" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The fonts of the first screen. The @font-face rules are in index.css.
         The italic is "Sagar" on the first-visit splash
         (components/Preloader.tsx); without it the name would appear in a
         fallback face first. -->
    <link rel="preload" href="/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/host-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/host-grotesk-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />

    <meta name="author" content="Sagar H R & Co." />
    <meta name="geo.region" content="IN-KA" />
    <meta name="geo.placename" content="Mysuru, Karnataka" />

    <meta property="og:site_name" content="Sagar H R & Co." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- SEO-2: static fallback metadata. Social/link scrapers (WhatsApp,
         LinkedIn, X, Facebook) don't run JavaScript, so without these the raw
         HTML had no title/description/preview and every share was blank. When
         JS runs, the per-route <SEO> component (React 19 document metadata)
         supplies the exact per-page title/description/canonical. A full
         prerendering pass will later render correct per-page meta server-side.
         The wording is the home page's: its title and description
         (pages/Home.tsx), and its opening line for the share text. Keep the
         two in step. -->
    <title data-fallback>Sagar H R &amp; Co. | Chartered Accountants | Mysuru</title>
    <meta
      data-fallback
      name="description"
      content="Sagar H R &amp; Co., Chartered Accountants in Mysuru: income tax, GST, TDS, audit, company law and trusts, for individuals, businesses and institutions."
    />
    <meta data-fallback property="og:type" content="website" />
    <meta data-fallback property="og:title" content="Sagar H R &amp; Co. | Chartered Accountants | Mysuru" />
    <meta
      data-fallback
      property="og:description"
      content="Taxation, audit, company law and accounting services for individuals, businesses, institutions and trusts."
    />
    <meta data-fallback property="og:image" content="https://casagar.co.in/og/og-default.png" />
    <meta data-fallback name="twitter:card" content="summary_large_image" />
    <meta data-fallback name="twitter:title" content="Sagar H R &amp; Co. | Chartered Accountants | Mysuru" />
    <meta
      data-fallback
      name="twitter:description"
      content="Taxation, audit, company law and accounting services for individuals, businesses, institutions and trusts."
    />
    <meta data-fallback name="twitter:image" content="https://casagar.co.in/og/og-default.png" />
    <style>
      /* First paint, before the app has loaded. A first visit opens with the
         splash (components/Preloader.tsx), so the screen starts in the
         splash's black and the firm's name arrives on it without a flash.
         index.tsx adds .page once the splash has taken over, or at once when
         none is due (it has already been shown in this tab): the limestone
         the home page opens on (--stone in components/redesign/redesign.css).
         Readers who ask for less motion get no splash, so they start on the
         limestone. scripts/check-csp-hash.ts checks both colours. index.tsx
         removes the overlay once the page has painted. */
      #preload-hero {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: #0a0a0a;
      }
      #preload-hero.page {
        background: #f2efe8;
      }
      @media (prefers-reduced-motion: reduce) {
        #preload-hero {
          background: #f2efe8;
        }
      }
    </style>
  </head>

  <body class="overflow-x-hidden bg-[#F2F2F0] text-[#111111]">
    <div id="preload-hero" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
