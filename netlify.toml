# MNT-6: pin the Node version so Netlify's build matches package.json engines
# (22.x) and CI, instead of relying on Netlify's shifting default.
[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/faq"
  to = "/faqs"
  status = 301

# The About page became a section of the home page in October 2026. App.tsx
# sends /about the same way for a link followed inside the app.
[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301

# Retired Aug-2025 insight articles (replaced by the 2025-Act refresh).
# 301 to the topical successor where one exists, else to the insights index,
# so old inbound links and search results don't 404.
[[redirects]]
  from = "/insights/new-income-tax-bill-2025"
  to = "/insights/income-tax-act-2025-in-force"
  status = 301

[[redirects]]
  from = "/insights/gst-reforms-2.0"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/insights/tds-tcs-changes-2025"
  to = "/insights/tds-new-act-renumbering-thresholds"
  status = 301

[[redirects]]
  from = "/insights/house-property-income"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/insights/gst-compliance-updates"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/insights/sp-rating-upgrade"
  to = "/insights"
  status = 301

# Articles retired in October 2026: out of date or not worth keeping. The
# single-tax-year note was merged into the article on the new Act.
[[redirects]]
  from = "/insights/single-tax-year-explained"
  to = "/insights/income-tax-act-2025-in-force"
  status = 301

[[redirects]]
  from = "/insights/section-mapping-1961-to-2025"
  to = "/insights/income-tax-act-2025-in-force"
  status = 301

[[redirects]]
  from = "/insights/filing-fy-2025-26-last-return"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/insights/gst-2-0-one-year-on-msmes"
  to = "/insights"
  status = 301

[[redirects]]
  from = "/insights/gstat-operational-appeals"
  to = "/insights"
  status = 301

# Service pages renamed or merged in the 2026 redesign (LEGACY_SERVICE_SLUGS
# in constants/services.tsx).
[[redirects]]
  from = "/services/litigation"
  to = "/services/notices-and-appeals"
  status = 301

[[redirects]]
  from = "/services/bookkeeping"
  to = "/services/bookkeeping-and-payroll"
  status = 301

[[redirects]]
  from = "/services/payroll"
  to = "/services/bookkeeping-and-payroll"
  status = 301

# The single-page fallback. Every public address also has a file of its own
# in dist/ (scripts/generate-route-html.ts, Audit SEO-02), which Netlify serves
# ahead of this rule; this rule answers everything else.
#
# Audit SEO-05: once a deploy shows the route files being served (a link to
# /services/gst previews with its own title, and answers 200), this status can
# become 404, so that an unknown address answers 404 while the application
# still boots on it and shows "Page not found". Do not change it before then:
# if the route files were not served, every page would answer 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Vite names every file under /assets/ with a hash of its content, and the
# fonts never change, so a browser can keep them for a year without asking.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Regenerate the style-src-elem hash whenever the inline <style> block in index.html changes.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # SEC-7: block Adobe cross-domain policy files, and register a modern
    # Reporting-Endpoints group so `report-to` works alongside legacy report-uri.
    X-Permitted-Cross-Domain-Policies = "none"
    Reporting-Endpoints = 'csp-endpoint="/.netlify/functions/csp-report"'
    # The contact and careers forms post straight to FormSubmit from the browser
    # (connect-src https://formsubmit.co). Botpoison, and the 'wasm-unsafe-eval'
    # and blob: worker allowances it needed (CF-5), were removed with it. Google
    # Analytics hosts were removed with the cookie banner: the site runs no
    # analytics.
    # SEC-7: frame-ancestors 'none' now matches X-Frame-Options: DENY (no
    # contradiction); report-to mirrors report-uri for modern browsers.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; style-src-elem 'self' 'sha256-1O4YeJZLoa9uXIPlcd1BixYaXikEV2rmwA4dZWV9qR0='; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://formsubmit.co; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /.netlify/functions/csp-report; report-to csp-endpoint; upgrade-insecure-requests;"
    X-Frame-Options = "DENY"

